name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate version and generate commit notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_notes.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --output release-notes.md
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
  package:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: universal
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: cargo test --workspace --locked
      - name: Build universal macOS app
        if: matrix.platform == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          python3 scripts/package.py --platform macos --arch universal --binary target/aarch64-apple-darwin/release/sidekick --second-binary target/x86_64-apple-darwin/release/sidekick
      - name: Build Windows app and per-user installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package.py --platform windows --arch x86_64 --binary target/x86_64-pc-windows-msvc/release/sidekick.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Linux desktop packages
        if: matrix.platform == 'linux'
        run: |
          cargo build --release --locked
          python3 scripts/package.py --platform linux --arch x86_64 --binary target/release/sidekick
          dpkg-deb --info dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Sidekick-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Sidekick-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Reconcile shared integration ZIP checksums
        # Each platform produces an integration ZIP. After merging, all checksum
        # manifests must reference the single ZIP that will be published.
        run: |
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          root = Path("dist")
          for manifest in root.glob("*-SHA256SUMS.txt"):
              names = [line.split(maxsplit=1)[1] for line in manifest.read_text().splitlines()]
              manifest.write_text("".join(
                  f"{hashlib.sha256((root / name).read_bytes()).hexdigest()}  {name}\n"
                  for name in names
              ))
          PYTHON
      - name: Publish release notes and packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            flags=()
            if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
          fi

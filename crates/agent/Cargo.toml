[package]
name = "sidekick"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
host-agent-core = { path = "../agent-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
directories = "6"
fs2 = "0.4"
sysinfo = "0.37"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "wgpu_no_default_features", "x11", "wayland"] }
tempfile = "3"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["macos-window-resize-jitter-fix"] }
security-framework = "3"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12"] }
# gpu-allocator 0.28 caps windows at <=0.62 (0.62.0); unify its COM types with wgpu.
windows = { version = "=0.62.0", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-core = "0.62"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
plist = "1"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan"] }

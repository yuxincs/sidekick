[workspace]
members = ["crates/agent-core", "crates/agent"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
